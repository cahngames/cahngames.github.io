<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahn Games</title>
<meta name="description" content="Cahn Games makes small, glowing mobile games. Mothlight is coming soon to iOS and Android.">
<meta property="og:title" content="Mothlight by Cahn Games">
<meta property="og:description" content="Circle the lamp. Dodge the thorns. Coming soon to iOS and Android.">
<meta property="og:image" content="assets/mothlight-banner.png">
<link rel="icon" href="assets/mothlight-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap">
<style>
:root { color-scheme: dark; --bg: #1f0b2b; --bg2: #52193f; --ink: #fff2dc; --soft: rgba(255,242,220,.7); --line: rgba(255,242,220,.14); --lamp: #ffb547; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: linear-gradient(#1f0b2b, #52193f) fixed; color: var(--ink); font: 400 17px/1.6 "Nunito", "Segoe UI", system-ui, sans-serif; padding-inline: 20px; padding-block: 40px; }
.wrap { max-width: 46rem; margin: 0 auto; display: grid; gap: 40px; }
.brand { font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; font-size: 1.4rem; letter-spacing: .02em; }
.game { display: grid; gap: 22px; }
.game img.banner { width: 100%; border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 0 60px rgba(255,181,71,.18); }
h1 { font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1; margin: 0; text-shadow: 0 0 28px rgba(255,181,71,.5); }
p { margin: 0; color: var(--soft); max-width: 60ch; }
.pill { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(255,181,71,.16); border: 1px solid rgba(255,181,71,.45); color: var(--lamp); font-weight: 800; font-size: .9rem; }
nav { display: flex; flex-wrap: wrap; gap: 12px; }
nav a { color: var(--ink); text-decoration: none; font-weight: 800; padding: 10px 16px; border-radius: 14px; border: 1px solid var(--line); }
nav a:hover, nav a:focus-visible { border-color: var(--lamp); outline: none; }
footer { color: var(--soft); font-size: .9rem; border-top: 1px solid var(--line); padding-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Cahn Games</div>
  <section class="game">
    <img class="banner" src="assets/mothlight-banner.png" alt="Mothlight: a glowing moth circling a lamp">
    <span class="pill">Coming soon to iOS &amp; Android</span>
    <h1>Mothlight</h1>
    <p>Circle the lamp, hop between orbits with a single tap, collect sparks and slip past the thorns. The closer the call, the bigger the reward, and every lap the night spins a little faster.</p>
    <nav>
      <a href="mothlight/support/">Support</a>
      <a href="mothlight/privacy/">Privacy policy</a>
    </nav>
  </section>
  <footer>© 2026 Cahn Games · Jordan Cahn</footer>
</div>
</body>
</html>
